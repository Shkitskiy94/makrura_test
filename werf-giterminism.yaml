giterminismConfigVersion: 1
cli:
  allowCustomTags: true
config:
  goTemplateRendering:
    allowEnvVariables:
      - "BASE_GITLAB_URL"
      - "ISDEV"
      - "CI_COMMIT_SHORT_SHA"
      - "CI_COMMIT_TAG"
      - "LAB_PRIVATE_TOKEN"
helm:
  allowUncommittedFiles:
    - "**"
  allowUntrackedFiles:
    - "**"
  allowCustomTags: true
